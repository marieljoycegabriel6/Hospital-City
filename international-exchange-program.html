<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>International Exchange Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&family=Noto+Sans+TC:wght@500;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a teacher talking a Grade 6 class through the game on the projector; big, short, English with 中文 under every line.
   IDEA: a sliding passport: one slide per step of the Sakura Town journey, the route dots show where we are.
   PICTURE: the real game screenshot fills most of each step slide.
   COLOUR and TYPE: sakura pink #e2557f, festival indigo #1f2550, lantern orange #ff9f3a; Baloo 2, Nunito, Noto Sans TC/JP.
   LAYOUT: full-screen slides in a horizontal snap scroller, Prev/Next + arrow keys, counter and progress dots in a bottom bar. */
:root{--pink:#e2557f;--night:#1f2550;--orange:#ff9f3a;--ink:#232849;--soft:#6b6588}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#fff6fa;color:var(--ink);font:20px/1.45 Nunito,"Noto Sans TC",system-ui,sans-serif}
[lang=zh-Hant]{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
[lang=ja]{font-family:"Noto Sans JP","Hiragino Sans",sans-serif}
h1,h2{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(40px,6.5vw,84px);color:var(--pink)}
h2{font-size:clamp(30px,4.2vw,56px)}
.zh{display:block;font-family:"Noto Sans TC",sans-serif;font-weight:700;color:var(--soft);font-size:.55em;margin-top:6px;line-height:1.25}
.deck{position:fixed;inset:0 0 64px 0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;height:100%;padding:clamp(16px,3vw,44px) clamp(18px,4vw,64px);display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,2vh,22px);overflow-y:auto;background:linear-gradient(180deg,#dff0ff,#ffeaf2)}
.slide.night{background:radial-gradient(circle at 50% 20%,#3a3478,#1b2244);color:#fff}
.slide.night .zh{color:#d4cdf5}
.row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);gap:clamp(16px,3vw,48px);align-items:center}
.pic{border-radius:22px;overflow:hidden;box-shadow:0 14px 40px rgba(60,20,80,.25);background:#1b1b26}
.pic img{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain;background:#fff}
.pics{display:grid;gap:12px}.pics.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pics.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.where{display:inline-block;font-weight:800;color:var(--pink);background:#fff;border-radius:16px;padding:4px 16px;font-size:18px;margin-bottom:10px}
ul.pts{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:14px}
ul.pts li{padding-left:36px;position:relative;font-weight:800;font-size:clamp(20px,1.9vw,26px)}
ul.pts li::before{content:"★";position:absolute;left:2px;color:#f4b400}
ul.pts li span{display:block;font-weight:600;color:var(--soft);font-size:.82em}
.think{margin-top:18px;background:#fff;border-left:8px solid var(--orange);border-radius:16px;padding:12px 18px;font-weight:800}
.think span{display:block;font-weight:600;color:var(--soft)}
.title{text-align:center;align-items:center}
.title .tag{font-weight:800;font-size:24px;color:var(--night)}
.title .pic{max-width:900px;width:100%}
.route{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;position:relative;margin-top:10px}
.route::before{content:"";position:absolute;left:12%;right:12%;top:46px;border-top:6px dashed #e9a9c0}
.stop{text-align:center;position:relative}
.stop .ic{width:92px;height:92px;margin:0 auto 10px;border-radius:50%;display:grid;place-content:center;font-size:44px;background:#fff;border:5px solid var(--c);box-shadow:0 6px 18px rgba(120,40,80,.18)}
.stop b{display:block;font-family:"Baloo 2";font-size:24px;line-height:1.1}.stop small{display:block;color:var(--soft);font-weight:700;font-size:18px}
.stop em{display:inline-block;margin-top:8px;font-style:normal;font-weight:800;font-size:16px;background:var(--c);color:#fff;border-radius:14px;padding:3px 12px}
.goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
.goal{background:#fff;border-radius:20px;padding:14px;text-align:center;font-weight:800;font-size:22px}
.goal span{display:block;font-size:38px}.goal small{display:block;color:var(--soft);font-family:"Noto Sans TC";font-size:17px}
table{border-collapse:collapse;width:100%;background:#fff;border-radius:20px;overflow:hidden;font-size:clamp(17px,1.6vw,22px)}
td{padding:12px 16px;border-bottom:1px solid #f1d9e2;vertical-align:middle}
td .k{display:inline-block;font-weight:800;background:#ffe6ef;border-radius:12px;padding:4px 12px;white-space:nowrap}
td small{display:block;color:var(--soft);font-family:"Noto Sans TC";font-weight:700}
.frame{background:#fff;border-radius:26px;padding:18px 26px;border-top:12px solid var(--c)}
.frame ol{margin:10px 0 0;padding-left:30px;display:grid;gap:12px}
.frame li{font-weight:800;font-size:clamp(21px,2.1vw,30px)}
.frame li span:not(.blank){display:block;font-weight:600;font-size:.7em;color:var(--soft);font-family:"Noto Sans TC"}
.blank{display:inline-block;min-width:150px;height:1.05em;vertical-align:-.15em;border-bottom:4px dashed var(--c)}
.words{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.w{background:#fff;border:5px solid #f4c542;border-radius:20px;padding:10px;text-align:center}
.w .e{font-size:32px}.w .jp{font-size:clamp(20px,2vw,28px);font-weight:700}.w .ro{color:var(--pink);font-weight:800}
.w .en{font-weight:800}.w .z{color:var(--soft);font-family:"Noto Sans TC";font-weight:700}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.rule{background:#fff;border-radius:22px;padding:16px;text-align:center;font-weight:800;font-size:clamp(19px,1.8vw,24px)}
.rule .e{font-size:44px}.rule span{display:block;color:var(--soft);font-family:"Noto Sans TC";font-weight:700;font-size:.8em}
.qr{background:#fff;border-radius:28px;padding:20px;width:min(340px,70vw);margin:0 auto;color:var(--ink)}
.qr svg{display:block;width:100%;height:auto}
.bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--night);color:#fff}
.bar button{font:800 18px Nunito,sans-serif;border:0;border-radius:16px;padding:0 18px;height:46px;min-width:46px;background:#fff;color:var(--night);cursor:pointer}
.bar button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.bar button:disabled{opacity:.35;cursor:default}
.dots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}.dots i.on{background:#ff7fa8;transform:scale(1.4)}
.count{font-weight:800;white-space:nowrap}
@media(max-width:820px){.row{grid-template-columns:minmax(0,1fr)}.goals,.route{grid-template-columns:repeat(2,minmax(0,1fr))}.route::before{display:none}.words{grid-template-columns:repeat(2,minmax(0,1fr))}.rules{grid-template-columns:minmax(0,1fr)}.pics.three{grid-template-columns:minmax(0,1fr)}.slide{justify-content:flex-start}.dots{display:none}}
@media(prefers-reduced-motion:reduce){.deck{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="deck" id="deck" tabindex="-1" aria-label="Slides"></main>
<nav class="bar" aria-label="Slide controls">
  <button type="button" id="prev" aria-label="Previous slide">◀</button>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <span class="count" id="count" aria-live="polite">1 / 1</span>
  <button type="button" id="next" aria-label="Next slide">Next ▶</button>
</nav>

];

const deck = document.getElementById('deck');
deck.innerHTML = slides.join('');
const all = [...deck.children], N = all.length;
document.getElementById('dots').innerHTML = all.map(() => '<i></i>').join('');
const dots = [...document.querySelectorAll('#dots i')];
let cur = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const show = i => { cur = Math.max(0, Math.min(N - 1, i)); deck.scrollTo({ left: cur * deck.clientWidth, behavior: reduce ? 'auto' : 'smooth' }); paint(); };
const paint = () => {
  document.getElementById('count').textContent = `${cur + 1} / ${N}`;
  dots.forEach((d, i) => d.classList.toggle('on', i === cur));
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === N - 1;
};
deck.addEventListener('scroll', () => { const i = Math.round(deck.scrollLeft / deck.clientWidth); if (i !== cur) { cur = i; paint(); } }, { passive: true });
document.getElementById('prev').addEventListener('click', () => show(cur - 1));
document.getElementById('next').addEventListener('click', () => show(cur + 1));
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(N - 1);
});
addEventListener('resize', () => deck.scrollTo({ left: cur * deck.clientWidth }));
paint();
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital City — a 3D city of health &amp; English lessons</title>
<meta name="description" content="Hospital City is a blocky 3D city where Teacher Joyce keeps her coded Health and English lessons: classes are floors, hallways are units, rooms are lessons. Sign in to use it.">
<link rel="canonical" href="https://hospital-city.pages.dev/">
<meta property="og:type" content="website">
<meta property="og:title" content="Hospital City">
<meta property="og:description" content="A blocky 3D city of Health and English lessons. Sign in to use it.">
<meta property="og:url" content="https://hospital-city.pages.dev/">
<meta property="og:image" content="https://hospital-city.pages.dev/og.jpg">
<meta name="referrer" content="no-referrer">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#8fd3ff;font:600 18px system-ui,sans-serif;color:#1b1f2a;text-align:center}a{color:#1659c7}</style>
</head>
<body>
<p>🏥 Hospital City has moved to its own address:<br><a id="go" href="https://hospital-city.pages.dev/">hospital-city.pages.dev</a></p>
<script>
(async function () {
  var NEW = 'https://hospital-city.pages.dev/';
  var FN = 'https://br-snowy-field-azl2gpdd-auth.compute.c-3.ap-southeast-1.aws.neon.tech';
  // Clean up the old sign-in and the old copy of the lessons on this shared address, so other pages here can't read them.
  try {
    var s = localStorage.getItem('hc_session');
    if (s) await Promise.race([
      fetch(FN + '/sign-out', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session: s }) }).catch(function () {}),
      new Promise(function (r) { setTimeout(r, 3000); })
    ]);
    localStorage.removeItem('hc_session'); localStorage.removeItem('hc_user');
  } catch (e) {}
  try { await Promise.race([new Promise(function (r) { var q = indexedDB.deleteDatabase('hospital-city'); q.onsuccess = q.onerror = q.onblocked = r; }), new Promise(function (r) { setTimeout(r, 2000); })]); } catch (e) {}
  location.replace(NEW + location.hash);
})();
</script>
</body>
</html>

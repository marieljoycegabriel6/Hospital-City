.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:0;border-radius:14px;background:#fff;color:#2f3560;font-weight:bold;font-size:16px;padding:8px 14px;box-shadow:0 3px 0 rgba(0,0,0,.12);transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
button.big{font-size:19px;padding:12px 22px;border-radius:18px}
button.go{background:#e2557f;color:#fff}
button.on{background:#3d4a7a;color:#fff}
.say{background:#eaf4ff}

/* HUD */
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:5}
#zones{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.88);border-radius:30px;padding:6px 12px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.zone{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:20px;opacity:.55;font-size:14px}
.zone span{font-size:20px}.zone b{white-space:nowrap}
.zone.on{opacity:1;background:#ffe3ec}
.arrow{color:#b0a0b8;font-style:normal;font-weight:bold}
#stats{display:flex;gap:8px;align-items:center;pointer-events:auto}
#stats>div{background:rgba(255,255,255,.88);border-radius:30px;padding:8px 14px;font-size:18px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
#voiceBtn{font-size:14px;border-radius:30px}
@media (max-width:900px){.zone b{display:none}#voiceBtn{font-size:12px;padding:8px}}

/* controls */
#controls{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 22px;z-index:5;pointer-events:none}
#controls button{pointer-events:auto}
#left,#right{width:96px;height:96px;border-radius:50%;font-size:40px;background:rgba(255,255,255,.9);color:#3d4a7a;box-shadow:0 5px 0 rgba(0,0,0,.15),0 6px 18px rgba(0,0,0,.15);touch-action:none}
#left.down,#right.down{background:#ffe3ec;transform:scale(.95)}
#talk{font-size:26px;padding:16px 34px;border-radius:40px;background:#e2557f;color:#fff;margin-bottom:14px;animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

/* tip, toast */
#tip{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:#fff;border-radius:20px;padding:12px 24px;font-size:22px;font-weight:bold;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:6;text-align:center;max-width:90vw}
#toast{position:fixed;left:50%;top:140px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#fffbea;border:4px solid #f4c542;border-radius:24px;padding:14px 22px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:7}
#toast.pop{animation:pop .35s}
@keyframes pop{0%{transform:translateX(-50%) scale(.5)}80%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
#toast .coin-ico{font-size:44px}#toast .jp{font-size:30px;font-weight:bold}#toast .ro{font-size:20px;color:#9a6a00}#toast .en{font-size:20px}
#toast .say{font-size:26px;border-radius:50%;width:56px;height:56px;padding:0}

/* name tags */
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;padding:5px 14px;border-radius:16px;color:#fff;font-weight:bold;font-size:16px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.tag.me{background:#3d4a7a}.tag.yuki{background:#e2557f}.tag.haruto{background:#e8743b}.tag.gone{display:none!important}
.bang{display:inline-block;background:#f5d547;color:#7a4a00;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;animation:bounce .8s infinite}
@keyframes bounce{50%{transform:translateY(-4px)}}

/* dialog */
#dialog{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(860px,94vw);z-index:8}
.dlg{background:#fff;border-radius:26px;padding:18px 24px 16px;box-shadow:0 8px 28px rgba(0,0,0,.25);border-top:8px solid var(--c);position:relative}
.dlg .who{position:absolute;top:-24px;left:24px;background:var(--c);color:#fff;border-radius:20px;padding:6px 18px;font-size:20px;font-weight:bold}
.dlg .who small{opacity:.85;font-weight:normal}
.dlg .face{margin-right:6px}
.dlg .txt{font-size:26px;font-weight:bold;margin:12px 0 10px;line-height:1.35}
.dlg .txt.big{font-size:30px;color:var(--c)}
.dlg .ja{font-size:20px;color:#888;font-weight:normal;margin-top:4px}
.dlg .zh{font-size:24px;color:#555;font-weight:bold;margin-top:6px;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Noto Sans CJK TC",sans-serif}
.dlg .sayit{display:inline-block;background:#fff3c4;border-radius:12px;padding:4px 12px;font-size:16px;margin-bottom:8px}
.dlg-btns{display:flex;justify-content:flex-end;gap:10px}
.dlg-btns button{font-size:20px;padding:10px 20px}

/* stamp pop */
.stamp-pop{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:none;background:rgba(255,255,255,.35)}
.stamp{width:200px;height:200px;border-radius:50%;border:10px solid #e2557f;color:#e2557f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:70px;background:rgba(255,255,255,.92);animation:stampin .45s cubic-bezier(.3,1.6,.6,1);transform:rotate(-12deg)}
.stamp span{font-size:24px;font-weight:bold}.stamp small{font-size:14px;font-weight:bold}
.stamp-pop p{font-size:30px;font-weight:bold;background:#fff;border-radius:20px;padding:8px 22px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
@keyframes stampin{0%{transform:scale(3) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}

/* full screens */
#screen{position:fixed;inset:0;z-index:10;display:none}
#screen.center,#screen.dressing,#screen.studio-wrap,#screen.final-wrap{display:flex}
#screen.center{align-items:center;justify-content:center}
#screen.bgsoft{background:linear-gradient(#bfe4ff,#ffe3ec)}
.panel{background:#fff;border-radius:30px;padding:30px 40px;box-shadow:0 10px 40px rgba(0,0,0,.15);max-width:92vw}
.center-text{text-align:center}
.title-panel{text-align:center;max-width:620px}
.title-panel .logo{font-size:70px}
.title-panel h1{margin:0;font-size:46px;color:#e2557f;line-height:1.05}
.title-panel h1 span{font-size:30px;color:#3d4a7a}
.title-panel p{font-size:20px}
.title-panel .go{font-size:30px;padding:16px 60px;margin:10px 0 18px}
.quality{font-size:16px;display:flex;gap:8px;justify-content:center;align-items:center}
.title-panel small{display:block;margin-top:8px;color:#888}
.spinner{font-size:60px;animation:spin 1.6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* dressing room */
#screen.dressing{pointer-events:none}
.dress{display:flex;width:100%;height:100%}
.dress-panel{pointer-events:auto;width:min(470px,46vw);height:100%;overflow:auto;background:rgba(255,255,255,.93);padding:18px 20px;box-shadow:4px 0 20px rgba(0,0,0,.12)}
.dress-panel h2{margin:0 0 10px;color:#e2557f}
.namebox{display:flex;align-items:center;gap:8px;font-weight:bold;font-size:18px;margin-bottom:12px}
.namebox input{flex:1;font-size:20px;padding:8px 12px;border-radius:12px;border:3px solid #d8d0e8;font-family:inherit;min-width:0}
.namebox input:focus{outline:none;border-color:#e2557f}
.shake{animation:shake .4s;border-color:#e8434b!important}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{font-size:15px;padding:8px 10px;background:#f2eef8}
.tabs button.on{background:#3d4a7a}
.tabbody h4{margin:10px 0 6px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{background:#f7f3fb}
.choices button.on{background:#e2557f;color:#fff}
.choices.gender button{font-size:26px;padding:16px 30px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:42px;height:42px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 2px #ccc}
.sw.on{box-shadow:0 0 0 4px #e2557f;background-clip:padding-box}
.note{color:#777;font-size:15px}
.dress-actions{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:0;background:rgba(255,255,255,.95);padding:10px 0}
.dress-actions .go{flex:1}
.spin-hint{position:absolute;right:20px;bottom:20px;background:rgba(255,255,255,.85);border-radius:20px;padding:8px 16px;font-weight:bold}
@media (max-aspect-ratio:1/1){.dress{flex-direction:column-reverse}.dress-panel{width:100%;height:55%}.spin-hint{top:20px;bottom:auto}}

/* studio */
#screen.studio-wrap{background:linear-gradient(#fff6fa,#eef6ff)}
.studio{display:flex;flex-direction:column;width:100%;height:100%}
.st-head{background:var(--c);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.st-q{font-size:22px;font-weight:bold;flex:1;min-width:280px}
.st-q small{display:block;font-size:15px;opacity:.85}
.st-q .zh{font-size:19px;opacity:.95;margin-top:2px;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Noto Sans CJK TC",sans-serif}
.say.mini{font-size:16px;padding:4px 10px}
.st-steps{display:flex;gap:6px;align-items:center;font-weight:bold}
.st-steps span{background:rgba(255,255,255,.25);padding:6px 12px;border-radius:14px}
.st-steps span.on{background:#fff;color:var(--c)}
.st-steps i{font-style:normal}
.st-body{flex:1;overflow:auto;padding:14px 20px}
.st-body h3{margin:4px 0 12px;font-size:22px}
.st-foot{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;box-shadow:0 -3px 12px rgba(0,0,0,.08)}
.st-foot .msg{flex:1;text-align:center;color:#e8434b;font-weight:bold;font-size:18px}
.st-foot .go{margin-left:auto}

/* draw pad */
.dp{display:flex;gap:16px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.dp-canvas-wrap{position:relative;flex:1 1 600px;max-width:min(1100px,calc((100vh - 230px) * 16 / 9))}
.dp canvas{width:100%;aspect-ratio:16/9;background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.12);touch-action:none;cursor:crosshair;display:block}
.dp-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:#ccc;pointer-events:none;font-weight:bold}
.dp-tools{width:290px;display:flex;flex-direction:column;gap:10px}
.dp-row{display:flex;flex-wrap:wrap;gap:6px}
.dp-modes button{font-size:20px;padding:12px 16px;flex:1}
.dp-acts{margin-top:6px}.dp-acts button{font-size:17px;flex:1}
.dp-sizes button{width:46px;height:46px;display:flex;align-items:center;justify-content:center;padding:0}
.dp-sizes i{display:block;background:#333;border-radius:50%}
.dp-sizes button.on i{background:#fff}
.dp-colors button{width:38px;height:38px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 2px #ccc}
.dp-colors button.on{box-shadow:0 0 0 4px #e2557f}
.dp-label{font-size:14px;color:#777;font-weight:bold}
.dp-modes button.on{background:#ffe3ec;color:#2f3560;box-shadow:0 0 0 3px #e2557f}
@media (max-width:900px){.dp-tools{width:100%}}

/* write */
.frames{display:flex;flex-direction:column;gap:14px;max-width:1000px}
.frame{display:flex;gap:12px;background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 3px 12px rgba(0,0,0,.07)}
.num{width:36px;height:36px;border-radius:50%;background:#3d4a7a;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.fbody{flex:1}
.prompt{font-weight:bold;font-size:20px;margin-bottom:8px}
.sent{font-size:24px;font-weight:bold;line-height:1.8;margin:4px 0 8px}
.blank{font-family:inherit;font-size:22px;font-weight:bold;color:#e2557f;border:0;border-bottom:3px dashed #e2557f;background:#fff5f8;border-radius:8px 8px 0 0;padding:2px 8px;max-width:100%}
.blank:focus{outline:none;background:#ffe3ec}
.blank.need{background:#ffe0e0;border-bottom-color:#e8434b}
.blank.flash{animation:flash .5s}
@keyframes flash{0%{background:#fff3a0}}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.bank button{font-size:16px;padding:6px 10px;background:#f4f1fa;font-weight:bold}
.bank button span{margin-right:4px}
.meters{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.meter{background:#fff;border-radius:20px;padding:12px 16px;box-shadow:0 3px 12px rgba(0,0,0,.07)}
.meter b{display:block;margin-bottom:6px;font-size:18px}
.meter button{font-size:28px;background:none;box-shadow:none;padding:2px 4px}

/* practice */
.script{background:#fff;border-radius:20px;padding:16px 20px;box-shadow:0 3px 12px rgba(0,0,0,.07);max-width:1000px}
.line{display:flex;gap:12px;align-items:center;font-size:28px;font-weight:bold;padding:8px 0;border-bottom:1px dashed #eee}
.line:last-child{border:0}
.prac-btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0 6px}
.rec{background:#ffe3ec}.rec.on{background:#e8434b;color:#fff;animation:pulse 1s infinite}
.recmsg{font-size:18px;color:#555}
.stars{font-size:20px;display:flex;align-items:center;gap:6px}
.star{font-size:34px;background:none;box-shadow:none;padding:0 4px}

/* final */
#screen.final-wrap{background:linear-gradient(#bfe4ff,#ffe3ec);overflow:auto;display:block}
.final{max-width:1300px;margin:0 auto;padding:20px;text-align:center}
.final h1{color:#e2557f;margin:6px 0}
.final p{font-size:20px}
.cards{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.cardbox{background:#fff;border-radius:24px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.12);flex:1 1 520px;max-width:620px}
.cardbox img{width:100%;border-radius:12px;display:block}
.cbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.words{margin:22px auto;background:rgba(255,255,255,.85);border-radius:20px;padding:14px;max-width:1000px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:18px}
.words button{font-size:18px}.words small{color:#888;font-weight:normal}

#rotate{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#fff3c4;padding:8px 16px;border-radius:16px;font-weight:bold;z-index:6;font-size:14px;white-space:nowrap}

/* word book button */
#coinCount{border-radius:30px;padding:8px 14px;font-size:18px;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(0,0,0,.12)}
#coinCount.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.3);background:#fff3c4}}
.zh,[lang="zh-Hant"]{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Noto Sans CJK TC",sans-serif}
[lang="ja"]{font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif}

/* modal + word card */
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(30,30,60,.35);backdrop-filter:blur(3px);padding:16px}
.wcard{width:min(520px,94vw);max-height:94vh;overflow:auto;background:linear-gradient(#fffdf5,#fff);border-radius:30px;padding:18px 26px 22px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.3);border:6px solid #f4c542;position:relative}
.wcard.flipin{animation:flipin .6s cubic-bezier(.3,1.4,.6,1)}
@keyframes flipin{0%{transform:perspective(800px) rotateY(90deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.wc-top{display:flex;flex-direction:column;align-items:center;gap:4px}
.wc-new{background:#e2557f;color:#fff;font-weight:bold;border-radius:20px;padding:4px 16px;font-size:16px;animation:pulse 1s infinite}
.wc-emoji{font-size:64px;line-height:1.1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.wc-jp{font-size:58px;font-weight:bold;color:#2f3560;letter-spacing:2px;margin-top:4px}
.wc-ro{font-size:26px;color:#e2557f;font-weight:bold}
.wc-mean{margin:12px auto;background:#eef6ff;border-radius:20px;padding:10px 16px;display:inline-block;min-width:70%}
.wc-en{font-size:30px;font-weight:bold}
.wc-zh{font-size:32px;font-weight:bold;color:#3d4a7a}
.wc-use{font-size:17px;color:#555;background:#fff8e1;border-radius:16px;padding:8px 12px;margin:4px 0 14px}
.wc-use div{margin-top:2px}
.wc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wc-count{margin-top:12px;font-weight:bold;color:#9a6a00}

/* word book */
.book{width:min(900px,96vw);max-height:94vh;overflow:auto;background:#fff;border-radius:30px;padding:18px 22px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.book h2{margin:4px 0 14px;color:#e2557f}.book h2 small{color:#9a6a00;font-size:20px}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.bk{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:18px;padding:12px 8px;background:#f2eef8;color:#aaa;font-weight:bold}
.bk.got{background:#fff8e1;color:#2f3560;border:3px solid #f4c542;box-shadow:none}
.bk .e{font-size:34px}.bk b{font-size:20px}.bk small{font-size:13px;font-weight:normal}

/* omikuji quiz */
#screen.quiz-wrap{background:radial-gradient(circle at 50% 30%,#3a3478,#1b2244)}
.quiz{width:min(760px,94vw);text-align:center;color:#fff}
.qz-head{font-size:24px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qz-head span{background:rgba(255,255,255,.2);border-radius:16px;padding:4px 12px;font-size:18px}
.qz-dots{display:flex;gap:8px;justify-content:center;margin:12px 0}
.qz-dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25)}.qz-dots i.done{background:#f5d547}.qz-dots i.now{background:#ff7fa8;transform:scale(1.25)}
.qz-card{background:#fff;color:#2f3560;border-radius:28px;padding:20px;border:6px solid #d93a2b;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.qz-jp{font-size:64px;font-weight:bold}.qz-ro{font-size:26px;color:#e2557f;font-weight:bold;margin-bottom:8px}
.qz-ask{font-size:24px;font-weight:bold;margin:18px 0 10px}
.qz-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.qz-opts button{font-size:22px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px}
.qz-opts button span{font-size:30px}.qz-opts small{font-size:22px;color:#3d4a7a}
.qz-opts button.right{background:#3cb371;color:#fff}.qz-opts button.right small{color:#fff}
.qz-opts button.wrong{background:#e8434b;color:#fff;animation:shake .4s}.qz-opts button.wrong small{color:#fff}
.omikuji-box{font-size:120px;cursor:pointer;margin:30px auto;display:inline-block;background:#fff3e6;border-radius:30px;padding:20px 40px;color:#7a3b1a;border:6px solid #d93a2b}
.omikuji-box div{font-size:24px;font-weight:bold}
.omikuji-box.shake{animation:omshake .9s}
@keyframes omshake{10%,30%,50%,70%{transform:rotate(-14deg)}20%,40%,60%,80%{transform:rotate(14deg)}}
.omikuji{margin:24px auto;width:min(420px,90vw);background:#fffdf5;color:#2f3560;border-radius:10px;padding:20px 24px;border-top:18px solid #d93a2b;border-bottom:18px solid #d93a2b;box-shadow:0 12px 40px rgba(0,0,0,.4);animation:unroll .7s ease-out}
@keyframes unroll{0%{transform:scaleY(.05)}100%{transform:scaleY(1)}}
.om-big{font-size:96px;font-weight:bold;color:#d93a2b;line-height:1.1}.om-ro{font-size:22px;color:#888}
.om-en{font-size:34px;font-weight:bold}.om-zh{font-size:30px;font-weight:bold;color:#3d4a7a}
.om-msg{font-size:18px;margin-top:12px;color:#555}

.bk .en,.wbtn .en{font-size:15px}
.bk .zh,.wbtn .zh{font-size:17px;color:#3d4a7a}
.words b:first-child{flex-basis:100%}
.wbtn{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:120px;padding:8px 12px}
.wbtn .e{font-size:24px}.wbtn b{font-size:18px}.wbtn small{font-size:13px}

.final p.sent{background:#e6f7ec;color:#1e7a43;font-weight:bold;border-radius:16px;padding:10px 16px;display:inline-block}
.final #again{margin-top:20px}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fly to America!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* VOICE: a playful picture-book adventure for A1 kids on a projector
   IDEA: a pop-up storybook trip, Taiwan → USA → a family Thanksgiving dinner
   PICTURE: a tilted 3D map with a flying plane, an airport, a house door that swings open, a dining room
   COLOUR and TYPE: autumn pumpkin, gold, cranberry and sage on warm cream; Fredoka + Nunito
   LAYOUT: one 16:9 stage scaled to the screen; caption bar at the bottom, small controls at the right */
:root{color-scheme:light;--ink:#3B2416;--cream:#FFF6E6;--paper:#FFFDF8;--pumpkin:#E8772E;--gold:#F4B740;--berry:#B23A48;--sage:#7A9A5B}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#24150C;overflow:hidden}
body{font-family:'Nunito',Arial,sans-serif;color:var(--ink)}
.f{font-family:'Fredoka','Trebuchet MS',sans-serif;font-weight:600}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;flex:none;overflow:hidden;border-radius:28px;cursor:pointer;background:#FCE6C8;user-select:none;-webkit-user-select:none}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
.scene.on{opacity:1;visibility:visible}
.abs{position:absolute}
.emo{line-height:1}

/* map */
#mapScene{background:linear-gradient(#FFE9C7,#F7C188);perspective:1500px;perspective-origin:50% 0%}
#board{position:absolute;left:150px;top:190px;width:1300px;height:640px;transform-style:preserve-3d;transform-origin:50% 50%;-webkit-transform-style:preserve-3d}
#board>svg{position:absolute;left:0;top:0}
.pin{position:absolute;left:0;top:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.stand{position:absolute;left:0;bottom:0;transform:translateX(-50%) rotateX(-55deg);transform-origin:50% 100%;text-align:center;white-space:nowrap}
.flag{font-size:84px;line-height:1}
.tag{display:inline-block;font:600 36px 'Fredoka',sans-serif;background:var(--paper);border:5px solid var(--ink);border-radius:30px;padding:2px 24px;box-shadow:0 8px 0 var(--ink)}
.pole{width:8px;height:70px;background:var(--ink);margin:6px auto 0;border-radius:4px}
#planeIco{display:inline-block;line-height:0}
.ring{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;border:8px solid var(--gold);opacity:0}
.hint .ring{animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.25);opacity:0}}
#shadow{position:absolute;left:0;top:0;width:170px;height:70px;margin:-35px 0 0 -85px;border-radius:50%;background:radial-gradient(rgba(30,20,10,.45),rgba(30,20,10,0) 70%)}

/* airport */
#airScene{background:linear-gradient(#FFE2B4,#F8B675 72%)}
.sun{left:1290px;top:80px;width:170px;height:170px;border-radius:50%;background:#FFD66E;box-shadow:0 0 90px 20px rgba(255,214,110,.8);transition:top 7s ease,background 7s,box-shadow 7s}
.cloud{height:64px;border-radius:40px;background:var(--cream);animation:drift 18s linear infinite alternate}
.cloud::before{content:"";position:absolute;left:30%;top:-34px;width:46%;height:80px;border-radius:50%;background:var(--cream)}
@keyframes drift{to{transform:translateX(80px)}}
.sign{left:80px;top:70px;width:600px;text-align:center;font-size:50px;background:var(--paper);border:6px solid var(--ink);border-radius:30px;padding:16px 10px;box-shadow:0 10px 0 var(--ink)}
.post{top:180px;width:16px;height:470px;background:#7A4A26;border:4px solid var(--ink)}
#door{transform-box:fill-box;transform-origin:left center;transition:transform .8s ease}
#stairs{opacity:0;transform:translateX(40px);transition:opacity .5s,transform .5s}
.open #door{transform:scaleX(.08)}
.open #stairs{opacity:1;transform:none}
.walker{position:absolute;left:0;top:0;width:120px;height:170px;opacity:0}
.walker svg,.fam svg{display:block;width:100%;height:100%;overflow:visible}
.ec{opacity:0}.happy .eo{opacity:0}.happy .ec{opacity:1}

/* house */
#houseScene{background:linear-gradient(#F9CB92,#EA915A)}
#houseZoom{position:absolute;inset:0;transform-origin:800px 680px;transition:transform 1.2s cubic-bezier(.6,0,.35,1)}
.zoom #houseZoom{transform:scale(6)}
#doorFrame{left:720px;top:560px;width:160px;height:240px;background:#FFD27A;border:6px solid var(--ink);perspective:700px;box-shadow:inset 0 0 60px #FFB347}
#leaf{position:absolute;inset:0;background:#8A4520;border-right:6px solid var(--ink);transform-origin:left center;transition:transform 1s ease;display:flex;align-items:center;justify-content:center;font-size:70px}
#leaf::after{content:"";position:absolute;right:18px;top:118px;width:18px;height:18px;border-radius:50%;background:var(--gold);border:3px solid var(--ink)}
.dopen #leaf{transform:rotateY(-110deg)}

/* dining room */
#roomScene{background:linear-gradient(#F6D9A9,#EDC189)}
.floor{left:0;right:0;top:650px;bottom:0;background:repeating-linear-gradient(90deg,#B9773F 0 118px,#A9682F 118px 122px);border-top:8px solid var(--ink)}
.fam{position:absolute;left:0;top:0;width:156px;height:221px}
.chew{animation:chew .32s ease-in-out infinite alternate}
@keyframes chew{to{margin-top:-14px}}
.food{position:absolute;left:0;top:0;line-height:1}
.food .bite,.food .plate{transform-origin:50% 100%;display:block}
.food .plate{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:84px;opacity:0;transition:opacity .4s}
.eaten .plate{opacity:1}
.speech{position:absolute;left:0;top:0;font-size:56px;white-space:nowrap;background:var(--paper);border:6px solid var(--ink);border-radius:44px;padding:12px 38px;box-shadow:0 10px 0 var(--ink);opacity:0;transform:translate(-50%,-100%) scale(.4);transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.speech::after{content:"";position:absolute;left:50%;bottom:-24px;width:34px;height:34px;margin-left:-17px;background:var(--paper);border-right:6px solid var(--ink);border-bottom:6px solid var(--ink);transform:rotate(45deg)}
.speech.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
.big{font-size:84px;padding:16px 54px}
.pop{position:absolute;left:0;top:0;pointer-events:none;line-height:1}

/* ui */
#title{left:32px;top:28px;font-size:34px;background:var(--ink);color:var(--cream);padding:8px 28px;border-radius:40px}
#dots{right:36px;top:30px;display:flex;gap:14px;background:var(--paper);border:4px solid var(--ink);border-radius:30px;padding:10px 16px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--cream);border:4px solid var(--ink);transition:background .3s}
.dot.on{background:var(--pumpkin)}
#cap{left:50%;bottom:34px;transform:translateX(-50%);display:flex;align-items:center;gap:24px;white-space:nowrap;background:var(--paper);border:6px solid var(--ink);border-radius:60px;padding:14px 44px 14px 16px;box-shadow:0 10px 0 var(--ink)}
#capSay{font:800 28px 'Nunito',sans-serif;color:var(--cream);background:var(--berry);border-radius:40px;padding:10px 22px;letter-spacing:1px}
#capText{font-size:58px}
.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{from{transform:translateX(-50%) scale(.7)}}
#ctrl{right:24px;bottom:150px;display:flex;flex-direction:column;gap:12px}
#ctrl button{width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);background:var(--paper);color:var(--ink);font:700 30px 'Fredoka',sans-serif;cursor:pointer;box-shadow:0 5px 0 var(--ink);opacity:.85}
#ctrl button:hover,#ctrl button:focus-visible{opacity:1;background:var(--gold);outline:none}
#notes{right:110px;bottom:150px;width:560px;background:var(--paper);border:5px solid var(--ink);border-radius:28px;padding:22px 28px;font-size:24px;line-height:1.45;box-shadow:0 8px 0 var(--ink);display:none;cursor:default}
#notes.show{display:block}
#notes b{font-family:'Fredoka',sans-serif;font-size:28px;display:block;margin-bottom:6px}
#time{left:50%;top:30px;transform:translateX(-50%);font-size:32px;white-space:nowrap;background:var(--paper);border:4px solid var(--ink);border-radius:40px;padding:6px 26px;transition:background .8s,color .8s}
#time.night{background:#3A2F5C;color:#FFF6E6}
.walker svg,.fam svg{animation:breathe 2.4s ease-in-out infinite;transform-origin:50% 100%}
.fam:nth-of-type(odd) svg{animation-delay:-1.2s}
@keyframes breathe{50%{transform:scaleY(1.035)}}
.eo{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mapsun{left:90px;top:110px;width:120px;height:120px;border-radius:50%;background:#FFD66E;box-shadow:0 0 0 18px rgba(255,214,110,.35),0 0 0 40px rgba(255,214,110,.15);animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 26px rgba(255,214,110,.35),0 0 0 56px rgba(255,214,110,.12)}}
#sunsetSky{background:linear-gradient(#5B3E7A,#B65A8C 45%,#F59E72 80%);opacity:0;transition:opacity 7s ease}
#airTint{background:rgba(70,40,100,.3);opacity:0;transition:opacity 7s ease;pointer-events:none}
.dusk #sunsetSky,.dusk #airTint{opacity:1}
.dusk .sun{top:560px;background:#FF8C42;box-shadow:0 0 120px 40px rgba(255,140,66,.7)}
#nightSky{background:linear-gradient(#1F1D45,#4A3A6E 70%,#8C5A7E);opacity:0;transition:opacity 2.2s ease}
#houseTint{background:rgba(30,25,70,.38);opacity:0;transition:opacity 2.2s;pointer-events:none}
.night #nightSky,.night #houseTint{opacity:1}
.star{width:12px;height:12px;border-radius:50%;background:#FFF6C8;box-shadow:0 0 12px #FFF6C8;opacity:0;transition:opacity 1.2s}
.night .star,.room .star{opacity:1;animation:twinkle 1.6s ease-in-out infinite alternate}
.star:nth-child(3n){animation-delay:-.8s}
@keyframes twinkle{to{opacity:.3}}
.moon{left:1240px;top:80px;width:130px;height:130px;border-radius:50%;background:#FFF2B3;box-shadow:inset -26px -10px 0 #F4D77A,0 0 60px #FFF2B3;opacity:0;transform:translateY(80px);transition:opacity 2s,transform 2.2s}
.night .moon{opacity:1;transform:none}
.wglow{border:6px solid var(--ink);background:linear-gradient(var(--ink),var(--ink)) center/6px 100% no-repeat,linear-gradient(var(--ink),var(--ink)) center/100% 6px no-repeat,#FFE38A;opacity:0;transition:opacity .3s,box-shadow .3s}
.lights .wglow{opacity:1;box-shadow:0 0 70px 14px rgba(255,214,110,.85)}
.lampLight{left:620px;top:236px;width:360px;height:440px;background:linear-gradient(rgba(255,236,160,.6),rgba(255,236,160,0));clip-path:polygon(36% 0,64% 0,100% 100%,0 100%);pointer-events:none}
.room .lampLight{animation:flick 1.2s ease-out both}
@keyframes flick{0%{opacity:0}20%{opacity:1}30%{opacity:.2}45%{opacity:1}}
.clockLbl{left:380px;top:332px;width:180px;text-align:center;font-size:32px;background:var(--ink);color:var(--cream);border-radius:30px;padding:2px 0}
#ctrl button.off{text-decoration:line-through;opacity:.5}
@media (prefers-reduced-motion:reduce){.cloud,.chew,.hint .ring{animation:none}}
</style>
</head>
<body>

 </div>

<!-- AIRPORT -->

 <div class="abs sun"></div>
 <div class="abs cloud" style="left:760px;top:120px;width:230px"></div>

<div class="scene" id="roomScene">
 <svg class="abs" style="left:0;top:0" width="1600" height="140" viewBox="0 0 1600 140" aria-hidden="true">

 </svg>

<!-- UI -->

<script>
{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const stage=$('#stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fit=()=>{const k=Math.min(innerWidth/1600,innerHeight/900)*.98;stage.style.transform=`scale(${k})`};
addEventListener('resize',fit);fit();

const STEPS=[
 {cap:'Let’s fly to America! ✈️',note:'Say: “We are in Taiwan. Let’s fly to America!” Students hold their arms out like wings. Then click the plane.<br>美國 (měi guó) = America · 飛機 (fēi jī) = airplane'},
 {cap:'Welcome to the USA! 🇺🇸',fly:'Whoosh! ✈️',note:'Students “fly” with their arms while the plane flies. When it lands, say: “Welcome to the USA!”<br>歡迎 (huān yíng) = welcome'},
 {cap:'Family time! ❤️',note:'Say: “On Thanksgiving, families come together.” Watch the sun go down: it’s afternoon, then evening. Count the family: one, two, three, four! Students hug themselves.<br>家人 (jiā rén) = family'},
 {cap:'Dinner time! 🦃',note:'Point at the sky: “Look! The sun goes down. It’s evening!” Lights turn on. Knock in the air: “Knock, knock!” Inside, point at the clock: “6 o’clock. Dinner time!” Then: “Turkey! Pie! Corn! Bread! Salad!”<br>晚上 (wǎn shàng) = evening · 晚餐 (wǎn cān) = dinner · 火雞 (huǒ jī) = turkey'},
 {cap:'Yum, yum! I’m stuffed! 😋',note:'Everyone pretends to eat: “Yum, yum!” Then rub your tummy: “I’m stuffed!”<br>我吃得好飽 (wǒ chī de hǎo bǎo) = I’m so full'},
 {cap:'Thank you! I’m thankful for my family. 🙏',note:'Hands together: “Thank you!” Big kids say: “I’m thankful for my family.” Click ↺ to fly home.<br>謝謝 (xiè xie) = thank you · 感謝 (gǎn xiè) = thankful'}
];
$('#dots').innerHTML=STEPS.map(()=>'<div class="dot"></div>').join('');

let step=0,busy=false,timers=[];
const later=(fn,ms)=>timers.push(setTimeout(fn,reduce?Math.min(ms,50):ms));
function setCap(t){const c=$('#cap'),x=$('#capText');x.textContent=t;c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}
function setTime(t,night){const e=$('#time');e.textContent=t;e.classList.toggle('night',!!night)}
function setUi(){$$('.dot').forEach((d,i)=>d.classList.toggle('on',i<=step));$('#notes').innerHTML='<b>Step '+(step+1)+' of 6</b>'+STEPS[step].note}
function scene(id){$$('.scene').forEach(s=>s.classList.toggle('on',s.id===id))}
function place(el,x,y,s){el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%) scale(${s})`}

/* sound effects, made live with Web Audio (no files) */
let AC=null,muted=false;
function ac(){if(muted)return null;if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,dur,type,vol,when,f2){const a=ac();if(!a)return;const t=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05)}
function noise(dur,vol,f1,f2,when){const a=ac();if(!a)return;const t=a.currentTime+(when||0),n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const src=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();src.buffer=b;fl.type='bandpass';fl.Q.value=1.2;fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*.35);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(fl);fl.connect(g);g.connect(a.destination);src.start(t);src.stop(t+dur)}
const notes=(list,gap,type,vol)=>list.forEach((f,i)=>tone(f,.35,type||'triangle',vol||.18,i*gap));
const SFX={
 takeoff:()=>{noise(3.4,.35,250,1400);tone(90,3.4,'triangle',.12,0,170)},
 land:()=>{tone(880,.6,'sine',.22);tone(660,.9,'sine',.22,.28)},
 door:()=>noise(.5,.3,2500,600),
 boing:()=>tone(260,.28,'sine',.25,0,720),
 happy:()=>notes([523,659,784,1047],.11),
 whoosh:()=>noise(1,.35,400,2600),
 cricket:()=>{for(let k=0;k<6;k++)tone(4200,.05,'sine',.05,k*.09+(k>2?.35:0))},
 click:()=>tone(1500,.06,'square',.08),
 knock:()=>{tone(150,.14,'sine',.6,0,70);tone(150,.14,'sine',.6,.28,70)},
 creak:()=>tone(180,.9,'sawtooth',.04,0,330),
 bell:()=>{tone(1320,1.2,'sine',.18);tone(1980,.9,'sine',.08,.02)},
 nom:()=>{noise(.12,.25,900,500);tone(230,.1,'square',.06,.03,160)},
 yum:()=>{tone(520,.25,'triangle',.18,0,700);tone(700,.4,'triangle',.18,.22,420)},
 fanfare:()=>{notes([523,659,784],.13,'triangle',.2);tone(1047,.9,'triangle',.22,.42)},
 twinkle:()=>tone(1800+Math.random()*1400,.25,'sine',.05)
};

/* chibi family: dad, mom, girl, boy */
const SK='#F8D0A8',INK='#3B2416';
const HAIR=[
 {back:'',front:`<path d="M14 58 C10 20 38 6 60 6 C86 6 110 22 106 58 C96 40 80 30 60 34 C42 30 24 40 14 58 Z" fill="#5A3317"/>`},
 {back:`<path d="M12 60 C8 18 112 18 108 60 L114 124 C102 132 90 124 88 112 L32 112 C30 124 18 132 6 124 Z" fill="#7A3E1E"/>`,front:`<path d="M15 58 C16 18 104 18 105 58 C92 38 74 32 60 42 C48 32 28 38 15 58 Z" fill="#7A3E1E"/>`},
 {back:`<circle cx="12" cy="74" r="17" fill="#B5652A"/><circle cx="108" cy="74" r="17" fill="#B5652A"/>`,front:`<path d="M15 58 C16 16 104 16 105 58 C94 42 78 36 66 44 C56 34 30 38 15 58 Z" fill="#B5652A"/><path d="M80 20 L96 10 L98 30 Z M80 20 L66 8 L64 28 Z" fill="#E8772E"/><circle cx="81" cy="20" r="5" fill="#B23A48"/>`},
 {back:'',front:`<path d="M14 58 L16 32 L30 38 L38 14 L52 30 L62 6 L72 30 L86 14 L92 38 L104 32 L106 58 C92 40 76 34 60 36 C44 34 28 40 14 58 Z" fill="#3B2416"/>`}
];
const SHIRT=['#7A9A5B','#B23A48','#F4B740','#5DA9D6'],PANTS=['#5A3317','#5A3317','#7A4A26','#2F6A9E'];
const chibi=i=>`<svg viewBox="0 0 120 170" aria-hidden="true"><g stroke="${INK}" stroke-width="4" stroke-linejoin="round">
 <rect x="44" y="138" width="13" height="24" rx="6" fill="${PANTS[i]}"/><rect x="63" y="138" width="13" height="24" rx="6" fill="${PANTS[i]}"/>
 <ellipse cx="48" cy="164" rx="11" ry="6" fill="${INK}"/><ellipse cx="72" cy="164" rx="11" ry="6" fill="${INK}"/>
 <ellipse cx="33" cy="126" rx="9" ry="16" transform="rotate(20 33 126)" fill="${SK}"/><ellipse cx="87" cy="126" rx="9" ry="16" transform="rotate(-20 87 126)" fill="${SK}"/>
 <path d="M36 148 Q34 106 60 102 Q86 106 84 148 Z" fill="${SHIRT[i]}"/>
 ${HAIR[i].back}
 <circle cx="60" cy="60" r="46" fill="${SK}"/>
 ${HAIR[i].front}</g>
 <g class="eo"><ellipse cx="44" cy="66" rx="7" ry="10" fill="${INK}"/><ellipse cx="76" cy="66" rx="7" ry="10" fill="${INK}"/><circle cx="46.5" cy="61.5" r="3" fill="#fff"/><circle cx="78.5" cy="61.5" r="3" fill="#fff"/></g>
 <g class="ec" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"><path d="M37 68 Q44 58 51 68"/><path d="M69 68 Q76 58 83 68"/></g>
 <ellipse cx="34" cy="80" rx="8" ry="4.5" fill="#F59A9A" opacity=".75"/><ellipse cx="86" cy="80" rx="8" ry="4.5" fill="#F59A9A" opacity=".75"/>
 <path d="M53 81 Q60 89 67 81" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/></svg>`;
$$('.walker,.fam').forEach(el=>el.innerHTML=chibi(+el.dataset.c));

/* map, plane and camera */
const board=$('#board'),plane=$('#plane'),shadow=$('#shadow'),ico=$('#planeIco');
const A={x:320,y:380},B={x:990,y:330};
let cam={x:0,y:0,s:1},camT={x:0,y:0,s:1},fly=null;
function setPlane(x,y,z,r){plane.style.transform=`translate3d(${x}px,${y}px,${z}px)`;const k=Math.max(.35,1-z/520);shadow.style.transform=`translate(${x}px,${y}px) scale(${k})`;shadow.style.opacity=k;ico.style.transform=`rotate(${r}deg)`}
function frame(now){
 if(fly){
  const t=Math.min(1,(now-fly.t0)/fly.d),e=t<.5?2*t*t:1-((-2*t+2)**2)/2;
  const x=A.x+(B.x-A.x)*e,y=A.y+(B.y-A.y)*e-70*Math.sin(Math.PI*e),z=330*Math.sin(Math.PI*e);
  setPlane(x,y,z,-18*Math.cos(Math.PI*t)+3*Math.sin(t*16));
  camT.x=(650-x)*.2;
  if(t>=1){fly=null;setPlane(B.x,B.y,0,0);landed()}
 }
 cam.x+=(camT.x-cam.x)*.06;cam.y+=(camT.y-cam.y)*.06;cam.s+=(camT.s-cam.s)*.06;
 board.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s}) rotateX(55deg)`;
 requestAnimationFrame(frame);
}
function landed(){busy=false;setCap(STEPS[1].cap);SFX.land()}

/* airport family */
const walkers=$$('.walker');
const T=(x,y,s)=>`translate(${x}px,${y}px) translate(-50%,-100%) scale(${s})`;
function walk(el,i,instant){
 const fx=+el.dataset.x;
 el.getAnimations().forEach(a=>a.cancel());
 if(instant){el.style.opacity=1;el.style.transform=T(fx,690,1);return}
 el.style.opacity=0;el.style.transform=T(748,577,.5);
 const a=el.animate([
  {transform:T(748,577,.5),opacity:0},{transform:T(748,577,.85),opacity:1,offset:.15},
  {transform:T(690,610,.9),offset:.3},{transform:T(640,630,.95),offset:.42},{transform:T(600,650,1),offset:.55},
  {transform:T((600+fx)/2,630,1),offset:.75},{transform:T(fx,690,1),opacity:1}
 ],{duration:reduce?1:1700,delay:reduce?0:i*450,easing:'ease-in-out',fill:'forwards'});
 a.onfinish=()=>{el.style.opacity=1;el.style.transform=T(fx,690,1)};
 if(!reduce){later(SFX.boing,i*450+80);later(SFX.boing,i*450+1250)}
}

/* room */
const fams=$$('.fam'),foods=$$('.food');
fams.forEach(f=>place(f,+f.dataset.x,+f.dataset.y,1));
foods.forEach(f=>place(f,+f.dataset.x,+f.dataset.y,1));
function particle(ch,x,y,dx,dy,rot,dur,size){
 const p=document.createElement('div');p.className='pop f';p.textContent=ch;p.style.fontSize=size+'px';
 $('#roomScene').insertBefore(p,$('#roomSpeech'));
 const a=p.animate([{transform:`translate(${x}px,${y}px) rotate(0deg)`,opacity:1},{transform:`translate(${x+dx}px,${y+dy}px) rotate(${rot}deg)`,opacity:0}],{duration:dur,easing:'ease-out'});
 a.onfinish=()=>p.remove();
}
function speech(el,text,big){el.textContent=text;el.classList.toggle('big',!!big);el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}

function resetAll(){
 timers.forEach(clearTimeout);timers=[];fly=null;busy=false;
 $('#airScene').classList.remove('open','dusk');$('#houseScene').classList.remove('dopen','zoom','night','lights');$('#roomScene').classList.remove('room');
 walkers.forEach(w=>{w.getAnimations().forEach(a=>a.cancel());w.style.opacity=0});
 $('#famSpeech').classList.remove('show');$('#roomSpeech').classList.remove('show');
 fams.forEach(f=>f.classList.remove('chew','happy'));walkers.forEach(w=>w.classList.remove('happy'));
 foods.forEach(f=>{f.classList.remove('eaten');const b=f.querySelector('.bite');b.getAnimations().forEach(a=>a.cancel());b.style.transform='';b.style.opacity=''});
 $$('.pop').forEach(p=>p.remove());
 plane.classList.add('hint');
}

function enter(n,instant){
 if(n===0){setTime('☀️ Morning');scene('mapScene');setPlane(A.x,A.y,0,-12);camT={x:(650-A.x)*.2,y:0,s:1};setCap(STEPS[0].cap)}
 if(n===1){
  plane.classList.remove('hint');
  if(instant){setPlane(B.x,B.y,0,0);camT={x:(650-B.x)*.2,y:0,s:1};setCap(STEPS[1].cap)}
  else{busy=true;setCap(STEPS[1].fly);SFX.takeoff();fly={t0:performance.now(),d:reduce?1:3400}}
 }
 if(n===2){
  const run=()=>{scene('airScene');setCap(STEPS[2].cap);setTime('🌤️ Afternoon');
   if(instant){$('#airScene').classList.add('open','dusk');setTime('🌇 Evening');walkers.forEach((w,i)=>walk(w,i,true));$('#famSpeech').classList.add('show');walkers.forEach(w=>w.classList.add('happy'));return}
   later(()=>$('#airScene').classList.add('dusk'),600);
   later(()=>setTime('🌇 Evening'),5200);
   later(()=>{$('#airScene').classList.add('open');SFX.door()},400);
   later(()=>walkers.forEach((w,i)=>walk(w,i,false)),1100);
   later(()=>{speech($('#famSpeech'),'Family time! ❤️');SFX.happy();walkers.forEach(w=>w.classList.add('happy'))},1100+3*450+1700);
  };
  if(instant)run();else{camT={x:-880,y:80,s:2.6};SFX.whoosh();later(run,800)}
 }
 if(n===3){
  setTime('🌙 Evening',true);
  if(instant){scene('roomScene');$('#roomScene').classList.add('room');setCap(STEPS[3].cap);$('#roomSpeech').classList.add('show');$('#roomSpeech').textContent='Dinner time! 🦃';return}
  const h=$('#houseScene');scene('houseScene');setCap('The sun goes down… 🌅');busy=true;
  later(()=>h.classList.add('night'),200);
  later(SFX.cricket,900);
  later(()=>setCap('It’s evening! 🌙'),1700);
  later(()=>{h.classList.add('lights');SFX.click()},2500);
  later(SFX.cricket,2900);
  later(()=>{setCap('Knock, knock! 🚪');SFX.knock()},3400);
  later(()=>{h.classList.add('dopen');SFX.creak();setCap('Let’s go inside! 🏠')},4300);
  later(()=>{h.classList.add('zoom');SFX.whoosh()},5200);
  later(()=>{busy=false;scene('roomScene');$('#roomScene').classList.add('room');setCap(STEPS[3].cap);SFX.bell()},6200);
  later(()=>speech($('#roomSpeech'),'Dinner time! 🦃'),6800);
 }
 if(n===4){
  const sp=$('#roomSpeech');
  if(instant){fams.forEach(f=>f.classList.add('happy'));foods.forEach(f=>{f.classList.add('eaten');f.querySelector('.bite').style.opacity=0});sp.textContent='Yum! I’m stuffed! 😋';sp.classList.remove('big');sp.classList.add('show');setCap(STEPS[4].cap);return}
  sp.classList.remove('show');setCap('Yum, yum! 😋');
  fams.forEach(f=>f.classList.add('chew'));
  foods.forEach((f,i)=>later(()=>{
   const b=f.querySelector('.bite'),x=+f.dataset.x,y=+f.dataset.y;
   const a=b.animate([{transform:'scale(1)'},{transform:'scale(.75)',offset:.3},{transform:'scale(.8)',offset:.4},{transform:'scale(.45)',offset:.7},{transform:'scale(0)'}],{duration:reduce?1:900,fill:'forwards'});
   a.onfinish=()=>{b.style.opacity=0;f.classList.add('eaten')};
   particle(i%2?'Nom!':'Yum!',x-50,y-170,0,-120,0,900,46);SFX.nom();later(SFX.nom,220);
  },300+i*550));
  later(()=>{fams.forEach(f=>{f.classList.remove('chew');f.classList.add('happy')});speech(sp,'Yum! I’m stuffed! 😋');SFX.yum();setCap(STEPS[4].cap)},300+5*550+700);
 }
 if(n===5){
  const sp=$('#roomSpeech');fams.forEach(f=>f.classList.add('happy'));speech(sp,'Thank you! 🙏',true);setCap(STEPS[5].cap);
  if(instant)return;
  SFX.fanfare();
  for(let k=0;k<26;k++)later(()=>{if(k%3===0)SFX.twinkle();const f=fams[k%4];particle(['❤️','💛','🧡'][k%3],+f.dataset.x-30+Math.random()*40,+f.dataset.y-180,(Math.random()-.5)*160,-380-Math.random()*120,(Math.random()-.5)*40,2200,56)},k*140);
  for(let k=0;k<22;k++)later(()=>particle(k%2?'🍁':'🍂',Math.random()*1560,-90,(Math.random()-.5)*300,1000,360+Math.random()*360,4200,64),k*180);
 }
}

function go(n){resetAll();for(let i=0;i<=n;i++)enter(i,true);cam={...camT};step=n;setUi()}
function next(){if(busy)return;timers.forEach(clearTimeout);timers=[];if(step>=5){go(0);return}step++;setUi();enter(step,false)}
function prev(){if(step>0)go(step-1)}

stage.addEventListener('click',e=>{if(e.target.closest('button,#notes'))return;next()});
$('#bNext').onclick=next;$('#bPrev').onclick=prev;$('#bRe').onclick=()=>go(0);
$('#bSnd').onclick=()=>{muted=!muted;$('#bSnd').classList.toggle('off',muted)};
$('#bNotes').onclick=()=>$('#notes').classList.toggle('show');
function full(){const d=document.documentElement;try{const r=(d.requestFullscreen||d.webkitRequestFullscreen).call(d);if(r&&r.catch)r.catch(()=>{})}catch(e){}}
$('#bFull').onclick=full;
addEventListener('keydown',e=>{
 if(['ArrowRight',' ','Enter','PageDown'].includes(e.key)){e.preventDefault();next()}
 else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}
 else if(e.key==='r'||e.key==='R')go(0);
 else if(e.key==='n'||e.key==='N')$('#notes').classList.toggle('show');
 else if(e.key==='f'||e.key==='F')full();
 else if(e.key==='s'||e.key==='S')$('#bSnd').click();
});

go(0);requestAnimationFrame(frame);
}
</script>
